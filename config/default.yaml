# Built-in defaults. Loaded first, then overridden by config/env/<APP_ENV>.yaml,
# then by environment variables (APP_ENV, LOG_LEVEL, MONGODB_URI, MONGODB_DATABASE,
# MONGODB_*_TIMEOUT_MS/MONGODB_*_POOL_SIZE, API_HOST, API_PORT).
# Values are validated against pydantic models in src/aiagent/core/config.py.

app:
  name: aiagent
  env: dev
  debug: false
  log_level: INFO

api:
  prefix: /v1
  host: 127.0.0.1
  port: 8000
  root_path: ""

db:
  # MongoDB is the primary database. Set MONGODB_URI/MONGODB_DATABASE to override.
  uri: mongodb://localhost:27017/aiagent
  name: aiagent
  server_selection_timeout_ms: 3000
  connect_timeout_ms: 5000
  max_pool_size: 10
  min_pool_size: 0

health:
  db_timeout_seconds: 2

storage:
  artifacts_dir: data/artifacts
  # Versioned per-agent system instructions (FileInstructionSource); each file
  # is loaded as `<prompts_dir>/<ref>.md` at run time.
  prompts_dir: config/prompts

runtime:
  # Agent runtime (STEP 5) defaults. Per-agent overrides win via Agent.model.
  default_provider: mock
  default_model: mock-default
  default_max_tokens: 1024
  default_timeout_secs: 30
  max_input_chars: 200000
  max_output_chars: 100000
  inline_preview_chars: 4000
  retry:
    max_attempts: 3
    backoff_base_secs: 1
    backoff_cap_secs: 30
    jitter: true